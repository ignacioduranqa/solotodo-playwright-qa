
name: SoloTodo QA Automation

on:
  push:
    branches: [main, master]

  pull_request:
    branches: [main, master]

jobs:
  playwright-tests:
    name: Pruebas funcionales - Chromium

    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:
      # Descargar el repositorio.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Configurar Node.js.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # Instalar dependencias.
      - name: Install dependencies
        run: npm ci

      # Instalar Chromium y sus dependencias.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Ejecutar únicamente CP-001 al CP-008.
      # No ejecutar pruebas de autenticación personal.
      - name: Run functional tests
        run: >
          npx playwright test
          --config=playwright.config.ts
          --project=chromium
          --workers=1
          --grep-invert "CP-009|CP-010"

      # Publicar reporte de pruebas generales.
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solotodo-playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore
